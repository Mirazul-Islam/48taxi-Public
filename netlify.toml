[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Redirects: keep every old WordPress URL working (301 = permanent, passes SEO value).
# The 16 content URLs are unchanged, so they need no redirect at all.
# ---------------------------------------------------------------------------

# WordPress feeds, sitemaps and internals
[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/comments/feed/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/sitemap.rss"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/page-sitemap.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/default-sitemap.xsl"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-json/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-content/uploads/2016/12/long_distance_fares.pdf"
  to = "/schedule/#long-distance"
  status = 301
[[redirects]]
  from = "/wp-content/uploads/2016/12/casino_taxi.pdf"
  to = "/schedule/#rates-to-airport"
  status = 301
[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301

# Friendly aliases people (and old links) are likely to type
[[redirects]]
  from = "/prices/*"
  to = "/schedule/"
  status = 301
[[redirects]]
  from = "/rates/*"
  to = "/services-rates/"
  status = 301
[[redirects]]
  from = "/tours/*"
  to = "/tour/"
  status = 301
[[redirects]]
  from = "/park-and-fly/*"
  to = "/parkfly/"
  status = 301
[[redirects]]
  from = "/park-fly/*"
  to = "/parkfly/"
  status = 301
[[redirects]]
  from = "/truck-parking/*"
  to = "/truck-container-parking/"
  status = 301
[[redirects]]
  from = "/airport-pickup/*"
  to = "/gti/"
  status = 301
[[redirects]]
  from = "/booking/*"
  to = "/book-now/"
  status = 301
[[redirects]]
  from = "/limo/*"
  to = "/halifax-limo-service/"
  status = 301
[[redirects]]
  from = "/home/*"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Hashed build assets never change: cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex"
